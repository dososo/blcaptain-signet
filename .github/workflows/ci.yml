name: Signet CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装依赖
        run: python -m pip install pyyaml Pillow pytest
      - name: 运行公开测试
        run: python -m pytest -q
      - name: 验证许可证
        run: python skills/signet/ui/repo_license_gate.py
