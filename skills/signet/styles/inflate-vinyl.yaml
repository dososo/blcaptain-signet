schema_version: 3
id: inflate-vinyl
english_name: Inflate Vinyl
chinese_name: 充气软塑
tier: catalog
catalog_status: published
recipe_alias: v4 inflatable matte vinyl lane
summary: A playful inflatable matte-vinyl lane with air-filled volume, seam and valve tells, rounded tension, and recessed-shadow definition.
visual_dna:
- air-filled rounded tension
- seam and valve detail
- flexible matte vinyl skin
prompt_fragment: a single inflatable matte-vinyl object with air-filled rounded tension, soft seam ridges, one tiny recessed air valve, broad cushioned volume, diffuse color softness, and clean centered app-icon silhouette on a pure white master.
negative_fragment: text, logo, watermark, UI screenshot, generic glossy plastic, octane render, hard plastic shell, sharp corners, mirror reflection, wet shiny plastic, random highlight spots, busy toy pile.
positioning:
  one_liner: A playful inflatable vinyl lane for cute social, game, and kid-facing app icons.
  emotional_target: playful, cute, buoyant, friendly
  use_cases:
  - games
  - children's products
  - social apps
  - playful consumer utilities
  job: Turn simple objects into air-filled tactile icons with owned seam and valve details instead of hard plastic shine.
object_archetype:
  default: single inflatable utility object
  preferred:
  - inflatable bell
  - air-filled folder
  - vinyl toggle
  - buoyant chat bubble
  - soft game token
  - rounded life-ring tray
  forbidden:
  - hard plastic toy
  - sharp angular object
  - thin technical glyph
  - multi-object toy pile
color_behavior:
  palette: Palette is generated per request by the 5-role engine; color lives on subject parts, Detail is the dark structural anchor, and the ground stays white or quiet tile tint. Use buoyant friendly colors with Detail reserved for seam, valve, and tiny recessed marks.
best_for:
- playful game icons
- children's education
- social features
- cute community utilities
- event and party products
not_for:
- serious enterprise dashboards
- precision developer tools
- luxury glass or metal icons
- dense status systems
brand_adaptation_rules:
- map brand primary to the main vinyl chamber
- keep seam ridge and valve placement consistent across the set
- use Detail for valve, seam shadow, or tiny functional marks
- keep all objects single-focus and rounded
example_subjects:
- inflatable chat bubble
- vinyl notification bell
- air-filled folder
- soft game token
material_exclusivity:
  exclusive_material: flexible matte inflatable vinyl with seam and valve construction
  material_family: inflatable-matte-vinyl
  allows_glass: false
  light_model_enum: recessed-shadow
  forbidden_finish:
  - generic glossy plastic
  - octane look
  - hard plastic shell
  - mirror reflection
  - wet shiny plastic
  - sharp corner
  imperfection_injection: raised heat-welded seam, tiny recessed air valve, mild chamber tension dimples
character_dna:
  ref: juju
  species: white Bichon Frise curly-coat small dog
  role: complex-problem organizer adapted as a buoyant inflatable vinyl guide
  silhouette_invariants:
  - drooping-ear Bichon head and body mass
  - short-leg small-dog proportion
  - rounded curly-coat outer contour
  face_geometry:
    eye_nose_triangle: two dark vinyl eye patches plus one recessed nose mark in a fixed isosceles triangle
    eye_spacing: one implied eye-width gap between eyes
    catchlight: none
    expression_set:
    - happy
    - curious
    - wow
    - reassuring
    - pointing-out
    - celebrating
  proportion:
    head_to_body: large head, compact body, short legs
    canonical_angle: straight-on or slight 3/4 buoyant product view
  identity_marks:
  - orange scarf as a separate matte vinyl band
  identity_color:
    coat: warm white matte vinyl chamber
    accent: orange vinyl scarf band
    theme_color: generated palette role on prop or chamber only
  free_variables:
  - pose
  - expression
  - chamber segmentation
  - valve placement
  action_vocabulary:
  - waving
  - bouncing
  - holding-token
  - pointing
  - carrying-bubble
  articulation_joints:
    deformable:
    - chamber-squash
    - scarf-flex
    - front-paw-point
    rigid:
    - eye-nose triangle
    - ear droop
    - short-leg proportion
  forbidden_drift:
  - becomes-sheep
  - hard-plastic-toy
  - candy-translucency
  - missing-air-valve
  - missing-orange-scarf
  - sharp-corner-drift
  - extra-limbs
  character_fit: capable
  reference_artifacts:
  - turnaround_front_34_side
  - expression_sheet
  - do_dont_sheet
style_recipe:
  material_stack:
    base: flexible matte vinyl chamber filled with air
    edge: rounded inflated perimeter under soft internal tension
    inner_detail: raised heat-welded seam, tiny recessed valve, mild chamber dimples
    finish: diffuse matte vinyl skin with broad low-contrast environmental color softness
  lighting_rig:
    model_enum: recessed-shadow
    key: broad playful studio light that reveals chamber tension through soft tone
    rim: none
    shadow: recessed seam shadow and tiny valve shadow only
    forbidden_lighting:
    - octane render
    - mirror reflection
    - random highlight
    - wet shine
    - hard rim light
    - uncontrolled bloom
  camera:
    angle: straight-on or slight 3/4 product view
    projection: orthographic icon product view
    crop: single centered air-filled object, 82-88% optical occupancy
    safe_area_pct: 84
  color_system:
    max_colors: 5
    primary_role: generated Primary carries main vinyl chamber
    accent_role: generated Tertiary or orange accent marks scarf, valve trim, or small seam tab
    contrast_rule_ratio: '3:1'
    palette_engine: per-request 5-role palette with family selection
    palette_family: vivid
    role_chroma_bands: v4 chroma bands from house_palettes_vivid.yaml
    set_hue_rotation: rotate primary hue across sets when count>1
    colored_ground_default: saturated-sibling
    subject_carried_roles: primary/secondary/tertiary/accent/detail are assigned to subject parts; ground remains downstream tile
  detail_budget:
    macro: one buoyant inflated silhouette
    mid: one seam route plus one valve
    micro: small valve notch and chamber dimple only
    legibility_floor_px: 32
  edge_quality:
    outline: rounded inflated perimeter with soft tension
    interior_corner: heat-welded seam ridge with recessed shadow
    terminal: puffy vinyl taper, never a sharp corner
    bevel: inflated chamber curvature
    anti_aliasing: clean soft vinyl edge
  keyline_block:
    canvas_px: 1024
    live_area_px: 840
    padding_px: 92
    stroke_px: 18
    corner_radius_px: 48
    min_gap_px: 24
    pixel_snap: true
style_separation_lock:
  orthogonality_axis: material+construction
  namable_archetype: inflatable matte vinyl object with seam and recessed valve construction
  silhouette_rule: single air-filled object remains nameable before seam and valve details
  separation_matrix_neighbors:
  - soft-molded
  - candy-gloss
  - felt-field
  must_differ_from:
  - id: soft-molded
    differ_on:
    - detail
    - edge
    claim: visible seam ridge, valve, and air-chamber tension, not seamless soft-touch molded elastomer
  - id: candy-gloss
    differ_on:
    - material
    - finish
    claim: opaque matte vinyl chamber with seam and valve, not translucent sugar body or candy highlight
  - id: felt-field
    differ_on:
    - edge
    - grain
    claim: smooth inflated vinyl perimeter and heat-welded seam, not fuzzy wool fiber halo or poke texture
anti_style_drift:
  banned_tokens: shared
  per_style_negatives:
  - no generic glossy plastic
  - no octane render
  - no hard plastic shell
  - no random highlight spots
  - no sharp corners
  - no candy translucency
  anti_taste_patterns:
  - material collapses into hard plastic toy
  - seam and valve disappear
  - surface gains wet shine or mirror reflection
  - subject becomes a pile of toy parts
  - corners sharpen and lose air-filled tension
  is_vs_is_not:
    is: opaque inflatable matte vinyl with heat-welded seam and recessed valve
    is_not: hard plastic toy, translucent candy, fuzzy felt, glossy stock-render plastic
  default_gloss_guard: if wet shine, mirror reflection, octane look, or hard plastic shell appears, regenerate as matte inflatable vinyl with seam and valve
thumbnail_first_rules:
  min_size_px: 24
  grayscale_test: inflated silhouette, seam route, and valve mark read without palette hue
  silhouette_test: one buoyant rounded object remains nameable at 64px
  contact_sheet_64px_pass: true
  detail_survives_downscale_to: 24
batch_consistency_lock:
  camera: reuse identical straight-on or slight 3/4 crop across the set
  lighting: reuse recessed-shadow seam lighting with no rim or specular point
  material: reuse flexible matte vinyl, chamber tension, seam ridge, and valve construction
  palette: reuse palette_family and hue-rotation policy across siblings
  safe_area: subject within central 82-88% optical live area
  seed_policy: fixed seam width, valve size, and chamber-tension scale
human_review_rubric:
  silhouette_gate: pass if the named air-filled object reads at 64px grayscale before color is considered
  material_exclusivity_gate: pass if the surface is matte inflatable vinyl with seam and valve, not hard plastic
  glass_budget_gate: must remain non-glass and opaque
  character_identity_gate: when Juju is rendered, eye-nose triangle, drooping ears, small-dog mass, orange scarf, and air-valve tell remain readable
  contrast_gate_ratio: 3:1 minimum figure-ground and part-part contrast for app_icon surfaces
  drift_gate: fail hard plastic shell, missing seam/valve, candy translucency, sharp corners, or toy pile composition
  pass_fail_scoring: fail any hard gate before judging playfulness
  R1_palette_roles: subject shows at least 3 roles from the generated palette; area hierarchy keeps primary 55-70, secondary 20-30, tertiary 5-15
  R2_dark_anchor: Detail is the unique dark anchor; every bright role clears tone delta 40 and Primary clears tone delta 50 where the selected vivid hue allows it
  R3_silhouette_weight: black-silhouette test passes; minimum stroke is at least tile/32; app_icon subject scale targets 82-88% optical live area
  R4_quiet_ground: generation ground is pure white with no alpha for app_icon; colored ground is downstream tile only and keeps subject first
  R5_first_glance_read: one focal subject, readable at 48px, playful and air-filled in under one second
reference_policy:
  clean_room_boundary: learn public material and market principles only; no third-party names, prompts, images, compositions, icons, or product marks
  no_third_party_names: true
  no_copied_prompts_or_images: true
  original_naming_lock: Signet v4 style id is original kebab-case naming
regeneration_strategy:
  if_too_generic: restate inflatable matte vinyl chamber, heat-welded seam, recessed valve, and air-filled tension before any mood words
  if_too_busy: remove extra toy pieces and keep one centered air-filled object
  if_small_size_fails: enlarge the main inflated chamber, simplify seam route, keep one valve mark
  if_off_material: remove hard plastic shine and candy translucency; restore opaque matte vinyl with seam and valve
  if_character_drift: restore Bichon silhouette, eye-nose triangle, drooping ears, orange scarf, and single valve tell
presentation_staging:
  white_master: true
  colored_ground_default: saturated-sibling
  tile_generated_downstream: true
