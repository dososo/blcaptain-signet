schema_version: 3
id: facet-solid
english_name: Facet Solid
chinese_name: 低多边形
summary: 'An opaque low-poly solid style where every triangular face is a flat color step and depth comes from discrete facet
  values, not optical effects.

  '
visual_dna:
- opaque flat triangular facets
- hard polygon silhouette
- brightness steps per face
prompt_fragment: 'a low-poly faceted solid object, opaque matte surface, one flat color per triangle, hard triangular seams,
  volume by discrete brightness steps, sharp polygon vertices, centered slight top-down hero angle.

  '
negative_fragment: 'text, letters, numbers, wordmarks, fake logos, brand lookalikes, watermarks, UI chrome or screenshots,
  busy backgrounds, smooth curved surface, high-poly photoreal form, rainbow palette, wet look.

  '
color_behavior:
  palette: Palette is generated per request by the 5-role engine; color lives on subject parts, Detail is the dark structural
    anchor, and the ground stays white or quiet tile tint. one main hue in three or four value steps plus one small accent
    face under 10% area.
best_for:
- 3D and modeling tools
- terrain and outdoor apps
- AR and spatial products
- minimal game icons
- data structure tools
not_for:
- soft wellbeing products
- text-heavy document apps
- realistic commerce product icons
brand_adaptation_rules:
- map brand primary to one hue family with value steps
- use accent only as one small facet
- reduce face count before reducing silhouette size
example_subjects:
- low-poly mountain
- faceted network crane
- faceted Juju side head
material_exclusivity:
  exclusive_material: opaque matte faceted solid surface
  material_family: low-poly-solid
  allows_glass: false
  light_model_enum: discrete-facet-steps
  forbidden_finish:
  - crystal
  - gel
  - glass
  - translucent
  - refraction
  - specular
  - glow
  imperfection_injection: one flat tone per triangular face, visible hard value step between adjacent faces
character_dna:
  ref: juju
  species: white Bichon Frise curly-coat small dog
  role: complex-problem organizer adapted as opaque faceted solid geometry
  silhouette_invariants:
  - drooping-ear Bichon blob head and body mass
  - short-leg small-dog proportion
  - rounded curly-coat outer contour simplified into polygon outline
  face_geometry:
    eye_nose_triangle: three independent dark facets reserved from subdivision
    eye_spacing: one implied eye-width gap between eyes
    catchlight: none
    expression_set:
    - focused
    - curious
    - reassuring
    - thinking
    - pointing-out
  proportion:
    head_to_body: large head, compact body, short legs
    canonical_angle: slight 3/4 top-down faceted pose
  identity_marks:
  - orange scarf as one separate low-poly band
  identity_color:
    coat: warm white or main hue value steps
    accent: orange scarf facet band
    theme_color: one hue family
    annotation: none
  free_variables:
  - facet topology
  - pose
  - accent face
  - value steps
  action_vocabulary:
  - pointing
  - sorting-cards
  - holding-node
  articulation_joints:
    deformable:
    - head-tilt
    - front-paw-point
    rigid:
    - eye-nose triangle
    - ear droop
    - scarf band
  forbidden_drift:
  - crystal-animal
  - sliced-eye-nose-triangle
  - missing-orange-scarf
  - smooth-curved-body
  - reflective-gem
  - high-poly-render
  character_fit: capable
  reference_artifacts:
  - turnaround_front_34_side
  - expression_sheet
  - do_dont_sheet
style_recipe:
  material_stack:
    base: opaque matte solid split into triangular faces
    edge: hard triangular seams created by adjacent flat value changes
    inner_detail: medium-density facets that imply volume without texture
    finish: completely matte per-face color with no softened seams
  lighting_rig:
    model_enum: discrete-facet-steps
    key: single implied direction translated into discrete face values
    rim: none
    shadow: optional one flat faceted contact shape
    forbidden_lighting:
    - edge highlight
    - surface reflection
    - refraction
    - bloom
    - soft gradient shading
  camera:
    angle: 3/4 hero angle with slight top-down view
    projection: light perspective or locked isometric
    crop: centered single subject with breathing margin
    safe_area_pct: 80
  color_system:
    max_colors: 5
    primary_role: one hue family in three or four value steps
    accent_role: one small accent facet under 10% area
    contrast_rule_ratio: '3:1'
    palette_engine: per-request 5-role subject-carried palette; no fixed style-owned hex
    subject_carried_roles: primary/secondary/tertiary/accent/detail are assigned to subject parts; ground remains white or
      quiet tile tint
  detail_budget:
    macro: angular faceted mass
    mid: 12-40 triangular faces, reduced at small sizes
    micro: no texture beyond face divisions
    legibility_floor_px: 24
  edge_quality:
    outline: hard polygon line made by face silhouette
    interior_corner: sharp triangular vertex
    terminal: clean facet junction
    bevel: none
    anti_aliasing: crisp polygon edge
  keyline_block:
    canvas_px: 1024
    live_area_px: 820
    padding_px: 102
    stroke_px: 16
    corner_radius_px: 0
    min_gap_px: 24
    pixel_snap: true
style_separation_lock:
  orthogonality_axis: light_model
  namable_archetype: opaque low-poly faceted solid
  silhouette_rule: polygon outline and triangular face steps survive at 64px
  separation_matrix_neighbors:
  - prism-layer
  - carbon-twill
  - felt-field
  must_differ_from:
  - id: prism-layer
    differ_on:
    - light_model
    - grain
    claim: opaque flat facets, not separated glass layers
  - id: carbon-twill
    differ_on:
    - light_model
    - grain
    claim: flat per-face value steps, not diagonal woven twill
  - id: felt-field
    differ_on:
    - light_model
    - edge
    claim: hard triangular seams, not fuzzy rounded fiber
anti_style_drift:
  banned_tokens: shared
  per_style_negatives:
  - no smooth gradient shading
  - no reflective facet seam
  - no transparent body
  - no high-poly detail
  - no texture on faces
  anti_taste_patterns:
  - face seams gain highlights and turn gem-like
  - face count becomes too high and realistic
  - adjacent faces have too little value separation
  - rainbow palette replaces one hue family
  is_vs_is_not:
    is: opaque matte low-poly solid with flat value steps
    is_not: crystal, glass gem, high-poly render, smooth curved object
  default_gloss_guard: if any reflective seam, refraction, or smooth gradient appears, regenerate as opaque flat facets
thumbnail_first_rules:
  min_size_px: 24
  grayscale_test: face value steps still read volume without color
  silhouette_test: pure black silhouette stays angular and distinct from rounded styles
  contact_sheet_64px_pass: true
  detail_survives_downscale_to: 24
batch_consistency_lock:
  camera: same 3/4 top-down hero angle and projection choice
  lighting: same implied value-step direction
  material: same opaque faceted surface and face-count range
  palette: reuse the exact same palette_engine 5-role result and seed across the batch
  safe_area: subject within central 80%, 10% margin
  seed_policy: fixed facet topology density for siblings
human_review_rubric:
  silhouette_gate: pass if angular silhouette reads at 64px
  material_exclusivity_gate: pass if every face is opaque flat color
  glass_budget_gate: must remain non-glass
  character_identity_gate: pass if Juju eye-nose triangle remains as protected dark facets and scarf as orange band
  contrast_gate_ratio: lightest to darkest face at least 3:1
  drift_gate: fail reflective seams, smooth gradients, transparent body, or high-poly realism
  pass_fail_scoring: fail any hard gate before judging geometry
  R1_palette_roles: subject shows at least 3 roles from the generated palette; area hierarchy keeps primary 55-70, secondary
    20-30, tertiary 5-15; no machine triad band
  R2_dark_anchor: Detail is the unique dark anchor; every bright role clears tone delta 40 and Primary clears tone delta 50;
    never pure black or gray
  R3_silhouette_weight: black-silhouette test passes; minimum stroke is at least tile/32; app_icon subject scale targets 82-88%
    optical live area
  R4_quiet_ground: generation ground is pure white with no shadow; app_icon has no alpha; tile chroma stays below half of
    subject chroma
  R5_first_glance_read: one focal subject, readable at 48px, high-key without muddy dark regions
reference_policy:
  clean_room_boundary: learn public low-poly geometry principles only; do not copy any specific topology, artwork, prompt,
    image, or composition
  no_third_party_names: true
  no_copied_prompts_or_images: true
  original_naming_lock: facet-solid is an original Signet style id
regeneration_strategy:
  if_too_generic: increase adjacent face value steps and expose harder polygon vertices
  if_too_busy: reduce face count and merge small triangles
  if_small_size_fails: reduce to no more than 12 large faces
  if_off_material: remove reflective seams, transparent cues, smooth gradients, and texture
  if_character_drift: protect eye-nose triangle as three dark facets and keep orange scarf as a separate band
