schema_version: 3
id: duotone-pop
english_name: Duotone Pop
chinese_name: 双色扁平
tier: E
recipe_alias: duotone flat lane
summary: Flat two-color icon lane with bold geometry, transparent tone steps, and poster-like negative space.
visual_dna:
- two-color flat fill
- bold geometric plates
- poster-like negative space
prompt_fragment: a flat duotone icon object made from two bold color plates, using one main color and one accent color,
  with depth suggested only by opacity steps, large geometric shapes, and clean negative space.
negative_fragment: text, logo, watermark, UI screenshot, Corporate Memphis flat people, generic glossy 3D, dirty color clash,
  decorative confetti, bevel, drop shadow.
color_behavior:
  palette: Palette is generated per request by the 5-role engine; palette_family defaults to vivid; choose one main role and
    one accent role, with tone steps made by opacity rather than extra hues.
best_for:
- editorial app marks
- brand feature icons
- clear service metaphors
not_for:
- realistic product rendering
- subtle material icons
- dense scene illustration
brand_adaptation_rules:
- limit each icon to one main color plus one accent
- use opacity steps only when they clarify object structure
- leave functional white space around the main form
example_subjects:
- two-tone inbox tray
- pop megaphone mark
- simple billing card
material_exclusivity:
  exclusive_material: flat duotone vector plates with opacity steps
  material_family: duotone-flat-vector
  allows_glass: false
  light_model_enum: none-flat
  forbidden_finish:
  - Corporate Memphis flat people
  - generic glossy 3D
  - bevel
  - cast shadow
  - uncontrolled decoration
  imperfection_injection: tiny intentional offset between two flat plates only when it improves clarity
character_dna:
  ref: juju
  species: white Bichon Frise curly-coat small dog
  role: complex-problem organizer adapted only as a simplified duotone mark
  silhouette_invariants:
  - drooping-ear Bichon head and body mass
  - short-leg small-dog proportion
  - rounded curly-coat outer contour
  face_geometry:
    eye_nose_triangle: two black eye dots plus one black nose in a fixed isosceles triangle
    eye_spacing: one implied eye-width gap between eyes
    catchlight: none
    expression_set:
    - focused
    - curious
    - pointing-out
  proportion:
    head_to_body: large head, compact body, short legs
    canonical_angle: front or slight 3/4 flat silhouette
  identity_marks:
  - orange scarf
  identity_color:
    coat: warm white
    accent: orange scarf
    theme_color: generated accent role only
  free_variables:
  - pose
  - expression
  - accent placement
  - subject crop
  action_vocabulary:
  - pointing
  - sorting-cards
  - carrying-notes
  articulation_joints:
    deformable:
    - neck-tilt
    - front-paw-point
    - scarf-follow-through
    rigid:
    - eye-nose triangle
    - ear droop
    - small-dog proportion
  forbidden_drift:
  - becomes-sheep
  - pet-photography
  - flat-human-mascot
  - missing-orange-scarf
  - extra-limbs
  character_fit: object-only
  reference_artifacts:
  - turnaround_front_34_side
  - expression_sheet
  - do_dont_sheet
style_recipe:
  material_stack:
    base: opaque flat vector plate
    edge: clean bold geometric boundary
    inner_detail: second color plate and opacity steps for structure
    finish: matte flat fill with no light effect
  lighting_rig:
    model_enum: none-flat
    key: none-flat poster read
    rim: none
    shadow: none
    forbidden_lighting:
    - bevel highlight
    - cast shadow
    - rim light
    - surface shine
  camera:
    angle: straight-on icon view
    projection: orthographic flat icon view
    crop: single centered object, 82-88% optical occupancy
    safe_area_pct: 84
  color_system:
    max_colors: 2
    primary_role: generated Primary carries the main plate
    accent_role: generated Tertiary or Accent carries the pop plate
    contrast_rule_ratio: '3:1'
    palette_engine: per-request 5-role palette with family selection
    palette_family: vivid
    role_chroma_bands: v4 chroma bands from house_palettes_vivid.yaml
    set_hue_rotation: rotate primary hue across sets when count>1
    colored_ground_default: white_canvas
    subject_carried_roles: exactly one main role and one accent role are assigned to subject parts; Detail may appear only
      as a tiny structure anchor
  detail_budget:
    macro: one bold two-color silhouette
    mid: one overlap or opacity step
    micro: no decorative marks beyond one functional anchor
    legibility_floor_px: 24
  edge_quality:
    outline: clean bold flat edge
    interior_corner: simple geometric cut
    terminal: flat cap or rounded terminal
    bevel: none
    anti_aliasing: crisp vector edge
  keyline_block:
    canvas_px: 1024
    live_area_px: 840
    padding_px: 92
    stroke_px: 22
    corner_radius_px: 48
    min_gap_px: 30
    pixel_snap: true
style_separation_lock:
  orthogonality_axis: color-count+plate-logic
  namable_archetype: two-color flat poster icon with bold plates and opacity steps
  silhouette_rule: single centered object remains nameable using only two colors
  separation_matrix_neighbors:
  - gradient-flow
  - geo-bauhaus
  - riso-press
  must_differ_from:
  - id: gradient-flow
    differ_on:
    - color_system
    - surface
    claim: two flat plates and opacity steps, not a related directional transition
  - id: geo-bauhaus
    differ_on:
    - geometry
    - palette_discipline
    claim: free bold brand geometry, not circle triangle square primary-color construction
  - id: riso-press
    differ_on:
    - edge
    - grain
    claim: crisp vector plates, not printed grain or registration offset
anti_style_drift:
  banned_tokens: flat-style-ban
  per_style_negatives:
  - no Corporate Memphis flat people
  - no generic glossy 3D
  - no dirty color clash
  - no decorative confetti
  - no bevel or cast shadow
  anti_taste_patterns:
  - extra hues break the two-color discipline
  - accent becomes random decoration instead of structure
  - opacity steps become fake shading
  - silhouette becomes a bland corporate blob
  is_vs_is_not:
    is: two-color flat vector object with functional accent plate
    is_not: corporate flat illustration, multicolor poster, glossy render
  default_gloss_guard: if shine, bevel, or depth appears, regenerate as matte duotone flat plates
thumbnail_first_rules:
  min_size_px: 24
  grayscale_test: subject remains readable as two value groups without hue
  silhouette_test: one bold two-color silhouette reads at 64px
  contact_sheet_64px_pass: true
  detail_survives_downscale_to: 24
batch_consistency_lock:
  camera: fixed orthographic flat icon crop
  lighting: none-flat, no shadow or rim light
  material: reuse opaque duotone vector plates and opacity-step logic
  palette: reuse palette_family and two-role assignment policy across siblings
  safe_area: subject within central 82-88% optical live area
  seed_policy: fixed base seed with per-icon primary role offset only
human_review_rubric:
  silhouette_gate: pass if the named object reads at 64px grayscale before color is considered
  material_exclusivity_gate: pass if it remains two flat vector plates, not shaded render material
  glass_budget_gate: must remain non-glass and none-flat
  character_identity_gate: when Juju is rendered, eye-nose triangle, drooping ears, white Bichon mass, and orange scarf remain
    readable
  contrast_gate_ratio: 3:1 minimum figure-ground and part-part contrast for app_icon surfaces
  drift_gate: fail if more than two main colors, random decoration, or corporate flat people appear
  pass_fail_scoring: fail any hard gate before judging color appeal
  R1_palette_roles: subject shows at least 3 roles from the generated palette only when Detail is counted; area hierarchy
    keeps primary 55-70, secondary 20-30, tertiary 5-15
  R2_dark_anchor: Detail is the unique dark anchor; every bright role clears tone delta 40 and Primary clears tone delta 50
    where the selected vivid hue allows it
  R3_silhouette_weight: black-silhouette test passes; minimum stroke is at least tile/32; app_icon subject scale targets 82-88%
    optical live area
  R4_quiet_ground: generation ground is pure white with no alpha for app_icon; colored ground is downstream tile only and
    keeps subject first
  R5_first_glance_read: one focal subject, readable at 48px, two-color structure in under one second
reference_policy:
  clean_room_boundary: learn public duotone and limited-color poster principles only; no third-party names, prompts, images,
    compositions, icons, or product marks
  no_third_party_names: true
  no_copied_prompts_or_images: true
  original_naming_lock: duotone-pop is an original Signet style id
regeneration_strategy:
  if_too_generic: restate one focal object, two flat plates, and one functional accent
  if_too_busy: remove extra colors, decorative fragments, and micro marks
  if_small_size_fails: thicken silhouette and enlarge the accent plate
  if_off_material: remove gloss, bevel, shadow, and rendered depth
  if_character_drift: restore Bichon silhouette, eye-nose triangle, drooping ears, and orange scarf
presentation_staging:
  white_master: true
  colored_ground_default: white_canvas
  tile_generated_downstream: true
asset_type_defaults:
- app_icon
- feature_icon
