schema_version: 3
id: carve-block
english_name: Carve Block
chinese_name: 木刻版画
summary: 'A high-contrast relief woodcut style where flat ink and carved white gouge marks define the form on uncoated paper.

  '
visual_dna:
- relief woodcut ink block
- carved V and U gouge marks
- ink-starved matte print texture
prompt_fragment: 'a relief woodcut print with a bold single-ink shape on uncoated matte paper, carved white gouge lines cutting
  through the form, chipped hand-carved contour, ink-starved uneven fill, orthographic front view.

  '
negative_fragment: 'text, letters, numbers, wordmarks, fake logos, brand lookalikes, watermarks, UI chrome or screenshots,
  busy backgrounds, vector-clean curve, poster illustration, more than two inks, smooth shading.

  '
color_behavior:
  palette: Palette is generated per request by the 5-role engine; color lives on subject parts, Detail is the dark structural
    anchor, and the ground stays white or quiet tile tint. one dark ink plus paper white; a tiny cinnabar stamp accent may
    appear under 5% area.
best_for:
- independent studios and workshops
- publishing and podcast marks
- handmade food and craft brands
- community badges
not_for:
- finance dashboards
- fine-grained system settings icons
- precision data tools
brand_adaptation_rules:
- keep the main shape as one ink color
- use brand accent only as a tiny stamp mark
- keep gouge lines wide enough to survive 24px
example_subjects:
- compass rose print block
- Juju sorting cards in woodcut
- crossed carving tools
material_exclusivity:
  exclusive_material: relief-print matte ink pressed into uncoated paper
  material_family: relief-print
  allows_glass: false
  light_model_enum: none-flat
  forbidden_finish:
  - gloss
  - gel
  - crystal
  - chrome
  - translucent
  - specular
  - glow
  imperfection_injection: chipped carved edge, V-gouge mark width variation, ink-starved fill
character_dna:
  ref: juju
  species: white Bichon Frise curly-coat small dog
  role: complex-problem organizer rendered natively as a relief print
  silhouette_invariants:
  - drooping-ear Bichon blob head and body mass
  - short-leg small-dog proportion
  - rounded curly-coat outer contour
  face_geometry:
    eye_nose_triangle: two black eye dots and one black nose held as solid print marks or carved negative dots
    eye_spacing: one implied eye-width gap between eyes
    catchlight: none
    expression_set:
    - focused
    - curious
    - reassuring
    - thinking
    - pointing-out
  proportion:
    head_to_body: large head, compact body, short legs
    canonical_angle: front or slight 3/4 print silhouette
  identity_marks:
  - orange scarf as a tiny second-ink stamp accent when used
  identity_color:
    coat: paper-white negative space or dark ink mass
    accent: cinnabar-orange scarf stamp
    theme_color: one ink color
    annotation: none
  free_variables:
  - pose
  - gouge direction
  - stamp accent placement
  - ink fill roughness
  action_vocabulary:
  - circling-keywords
  - sorting-cards
  - pointing
  articulation_joints:
    deformable:
    - head-tilt
    - front-paw-point
    - tail
    rigid:
    - eye-nose triangle
    - ear droop
    - short-leg proportion
  forbidden_drift:
  - vector-clean-line
  - smooth-poster-illustration
  - missing-eye-nose-triangle
  - missing-orange-scarf
  - sheep-drift
  - soft-pencil-sketch
  character_fit: native
  reference_artifacts:
  - turnaround_front_34_side
  - expression_sheet
  - do_dont_sheet
style_recipe:
  material_stack:
    base: single flat ink pressed into uncoated matte paper
    edge: hand-carved chipped contour with V and U gouge cuts
    inner_detail: parallel gouge hatching and paper-white negative lines
    finish: matte ink absorbed into paper with ink-starved uneven fill
  lighting_rig:
    model_enum: none-flat
    key: none, ink value carries the form
    rim: none
    shadow: none
    forbidden_lighting:
    - surface shine
    - soft dimensional shading
    - drop shadow
    - bevel lighting
    - bloom
  camera:
    angle: straight-on print view
    projection: orthographic flat
    crop: centered single subject with optional paper border
    safe_area_pct: 78
  color_system:
    max_colors: 2
    primary_role: dark ink creates form and ground
    accent_role: optional tiny cinnabar stamp mark only
    contrast_rule_ratio: '7:1'
    palette_engine: per-request 5-role subject-carried palette; no fixed style-owned hex
    subject_carried_roles: primary/secondary/tertiary/accent/detail are assigned to subject parts; ground remains white or
      quiet tile tint
  detail_budget:
    macro: one high-contrast ink mass
    mid: no more than two gouge hatching groups
    micro: chipped edge and one gouge line no thinner than 2px
    legibility_floor_px: 24
  edge_quality:
    outline: hand-carved gouge edge with chips
    interior_corner: rough carved notch
    terminal: gouge start-stop bite
    bevel: none
    anti_aliasing: crisp print edge with natural ink roughness
  keyline_block:
    canvas_px: 1024
    live_area_px: 800
    padding_px: 112
    stroke_px: 18
    corner_radius_px: 0
    min_gap_px: 28
    pixel_snap: true
style_separation_lock:
  orthogonality_axis: light_model
  namable_archetype: relief woodcut ink block on paper
  silhouette_rule: solid ink mass cut by paper-white gouge marks; chipped contour must read at 64px
  separation_matrix_neighbors:
  - draft-line
  - cyan-draft
  - riso-grain
  must_differ_from:
  - id: draft-line
    differ_on:
    - edge
    - grain
    claim: carved gouge and ink-starve, not pencil pressure or hand-wobble contour
  - id: cyan-draft
    differ_on:
    - edge
    - grain
    claim: carved black ink mass, not equal-width white technical line on blue ground
  - id: riso-grain
    differ_on:
    - edge
    - grain
    claim: gouge channels and ink-starve, not dot grain and registration offset
anti_style_drift:
  banned_tokens: shared
  per_style_negatives:
  - no smooth vector curve
  - no soft shading
  - no drop shadow
  - no poster gradient
  - no extra ink palette
  anti_taste_patterns:
  - gouge marks become clean vector strokes
  - more than two inks turn it into poster art
  - hatching gets too dense and becomes gray mush
  - chipped edge becomes symmetrical decoration
  is_vs_is_not:
    is: flat relief-print ink with carved gouge marks
    is_not: pencil sketch, vector icon, poster illustration, rendered object
  default_gloss_guard: if any dimensional light, shine, or smooth rendered curve appears, regenerate as flat relief print
thumbnail_first_rules:
  min_size_px: 24
  grayscale_test: solid ink mass and at least one white gouge line survive without color
  silhouette_test: main subject remains nameable after hatching is removed
  contact_sheet_64px_pass: true
  detail_survives_downscale_to: 24
batch_consistency_lock:
  camera: fixed orthographic front print
  lighting: none-flat, no shadow
  material: same ink-starve texture and gouge roughness
  palette: reuse the exact same palette_engine 5-role result and seed across the batch
  safe_area: subject within central 78%, 12% print margin
  seed_policy: fixed chip and ink-starve character, vary only motif
human_review_rubric:
  silhouette_gate: pass if solid ink shape and gouge cuts read at 64px
  material_exclusivity_gate: pass if it is relief-print ink, not vector or poster art
  glass_budget_gate: must remain non-glass
  character_identity_gate: pass if native Juju retains eye-nose triangle and scarf accent
  contrast_gate_ratio: ink to paper at least 7:1
  drift_gate: fail vector-clean edge, smooth shading, extra palette, or dimensional light
  pass_fail_scoring: fail any hard gate before judging print charm
  R1_palette_roles: subject shows at least 3 roles from the generated palette; area hierarchy keeps primary 55-70, secondary
    20-30, tertiary 5-15; no machine triad band
  R2_dark_anchor: Detail is the unique dark anchor; every bright role clears tone delta 40 and Primary clears tone delta 50;
    never pure black or gray
  R3_silhouette_weight: black-silhouette test passes; minimum stroke is at least tile/32; app_icon subject scale targets 82-88%
    optical live area
  R4_quiet_ground: generation ground is pure white with no shadow; app_icon has no alpha; tile chroma stays below half of
    subject chroma
  R5_first_glance_read: one focal subject, readable at 48px, high-key without muddy dark regions
reference_policy:
  clean_room_boundary: learn public relief woodcut print principles only; do not copy any artist's print, gouge pattern, prompt,
    image, or composition
  no_third_party_names: true
  no_copied_prompts_or_images: true
  original_naming_lock: carve-block is an original Signet style id
regeneration_strategy:
  if_too_generic: increase chipped contour, gouge bite, and ink-starved fill
  if_too_busy: remove hatching and keep one black mass plus one main gouge line
  if_small_size_fails: widen gouge lines and simplify to pure silhouette
  if_off_material: remove soft gradients, smooth curves, shadows, and render depth
  if_character_drift: first lock Juju silhouette, then apply gouge cuts while preserving eye-nose triangle and scarf
