schema_version: 3
id: celadon-goldline
english_name: Celadon Goldline
chinese_name: 青绿描金
summary: 'A clean-room cultural support style with celadon and indigo gouache color fields, matte goldline contour, and one
  simplified traditional motif inside a circular paper medallion.

  '
visual_dna:
- celadon and indigo flat gouache fields
- fine even matte goldline contour
- circular paper medallion with one simplified motif
prompt_fragment: 'a clean-room celadon-goldline motif icon on rice-white xuan paper, one centered circular medallion, flat
  celadon and indigo gouache color fields, fine even matte goldline or ink contour, single simplified traditional motif, front
  orthographic view.

  '
negative_fragment: 'text, letters, numbers, wordmarks, fake logos, brand lookalikes, watermarks, UI screenshots, busy backgrounds,
  copied artifact pattern, museum reproduction, mirror metal, wet paint, gradient inside color fields, dense ornament, random
  pseudo-Chinese marks.

  '
color_behavior:
  palette: Palette is generated per request by the 5-role engine; color lives on subject parts, Detail is the dark structural
    anchor, and the ground stays white or quiet tile tint. rice-white paper, celadon green, indigo blue, cinnabar accent,
    matte goldline, and ink; use no more than four visible colors per icon.
best_for:
- culture products
- education
- museum-like explainers
- editorial motif icons
- premium stationery
not_for:
- photoreal artifacts
- dense wallpaper patterns
- generic AI glass icons
- UI screenshots
brand_adaptation_rules:
- map brand color only to one celadon, indigo, or cinnabar field
- keep goldline contour thin and even across the set
- keep exactly one motif inside the circular medallion
example_subjects:
- huiwen key-fret medallion
- cloud scroll token
- Juju goldline medallion
material_exclusivity:
  exclusive_material: flat celadon and indigo gouache fields with matte goldline ink or foil on rice-white xuan paper
  material_family: goldline-gouache-on-paper
  allows_glass: false
  light_model_enum: none-flat
  forbidden_finish:
  - gloss
  - gel
  - chrome mirror
  - translucent wash
  - gold specular hotspot
  - wet shine
  imperfection_injection: tiny xuan-paper fiber, slight hand-painted edge registration, matte goldline thickness variance
    under strict control
character_dna:
  ref: juju
  species: white Bichon Frise curly-coat small dog
  role: complex-problem organizer translated into a celadon-goldline circular medallion motif
  silhouette_invariants:
  - drooping-ear Bichon blob head and body mass inside the medallion
  - short-leg small-dog proportion simplified as motif blocks
  - rounded curly-coat outer contour expressed by even goldline arcs
  face_geometry:
    eye_nose_triangle: three small ink or goldline dots in a fixed triangle
    eye_spacing: one implied eye-width gap between eyes
    catchlight: none
    expression_set:
    - focused
    - curious
    - reassuring
    - thinking
    - pointing-out
  proportion:
    head_to_body: large head, compact body, short legs
    canonical_angle: front circular medallion
  identity_marks:
  - orange scarf as cinnabar flat color field
  identity_color:
    coat: rice-white paper or pale celadon field
    accent: cinnabar orange scarf field
    theme_color: celadon or indigo field
    annotation: none
  free_variables:
  - motif family
  - medallion border
  - celadon-indigo balance
  - pose
  action_vocabulary:
  - pointing
  - circling-keywords
  - sorting-cards
  - holding-note
  articulation_joints:
    deformable:
    - head-tilt
    - front-paw-arc
    - tail-curve
    rigid:
    - eye-nose triangle
    - ear droop
    - scarf field
    - circular medallion
  forbidden_drift:
  - copied-artifact-pattern
  - mirror-metal-line
  - dense-wallpaper-repeat
  - missing-eye-nose-triangle
  - missing-orange-scarf
  - random-pseudo-calligraphy
  character_fit: capable
  reference_artifacts:
  - turnaround_front_34_side
  - expression_sheet
  - do_dont_sheet
style_recipe:
  material_stack:
    base: rice-white xuan paper ground
    edge: fine even matte goldline or ink contour plus circular medallion boundary
    inner_detail: one simplified traditional motif in flat celadon, indigo, or cinnabar color fields
    finish: matte gouache and absorbed linework with no coating
  lighting_rig:
    model_enum: none-flat
    key: none, flat paper read
    rim: none
    shadow: none
    forbidden_lighting:
    - gloss
    - emissive
    - chrome mirror
    - bloom
    - gold specular hotspot
  camera:
    angle: front orthographic view
    projection: orthographic flat
    crop: single centered circular medallion with full breathing margin
    safe_area_pct: 80
  color_system:
    max_colors: 4
    primary_role: celadon and indigo flat fields
    accent_role: cinnabar scarf or small motif accent
    contrast_rule_ratio: '3:1'
    palette_engine: per-request 5-role subject-carried palette; no fixed style-owned hex
    subject_carried_roles: primary/secondary/tertiary/accent/detail are assigned to subject parts; ground remains white or
      quiet tile tint
  detail_budget:
    macro: circular medallion plus one readable motif posture
    mid: no more than three flat color fields
    micro: thin goldline contour and one paper-fiber cue
    legibility_floor_px: 24
  edge_quality:
    outline: fine even goldline or ink contour
    interior_corner: rounded motif turn with consistent line width
    terminal: clean line closure at medallion edge
    bevel: none
    anti_aliasing: crisp matte line on paper
  keyline_block:
    canvas_px: 1024
    live_area_px: 820
    padding_px: 102
    stroke_px: 12
    corner_radius_px: 0
    min_gap_px: 24
    pixel_snap: true
style_separation_lock:
  orthogonality_axis: edge+grain
  namable_archetype: celadon flat-gouache circular medallion with matte goldline motif
  silhouette_rule: circular medallion, one motif posture, and fine even contour survive at 64px
  separation_matrix_neighbors:
  - draft-line
  - carve-block
  - cyan-draft
  - riso-grain
  - pixel-grid
  - contour-map
  - ink-wash
  - lacquer-seal
  must_differ_from:
  - id: draft-line
    differ_on:
    - edge
    - grain
    claim: even goldline medallion contour and flat celadon fields, not loose graphite pressure and corner overshoot
  - id: carve-block
    differ_on:
    - edge
    - grain
    claim: smooth equal goldline with gouache fields, not carved gouge edge and ink-starve block texture
  - id: cyan-draft
    differ_on:
    - edge
    - grain
    claim: circular medallion and traditional flat color fields, not white engineering line on blue with dimension ticks
  - id: riso-grain
    differ_on:
    - edge
    - grain
    claim: clean goldline contour and xuan-paper flat fields, not dot-dither grain and registration offset
  - id: pixel-grid
    differ_on:
    - edge
    - grain
    claim: rounded medallion line and smooth motif arcs, not hard square-cell stair steps and grid pitch
  - id: contour-map
    differ_on:
    - edge
    - grain
    claim: one enclosed motif with goldline boundary, not nested equal-interval contour-line density
  - id: ink-wash
    differ_on:
    - edge
    - grain
    claim: dry goldline contour and flat gouache color fields, not wet ink bleed and dry-brush wash edge
  - id: lacquer-seal
    differ_on:
    - material
    - edge
    claim: paper gouache medallion with fine goldline, not carved opaque lacquer relief and cut seal wall
anti_style_drift:
  banned_tokens: shared
  per_style_negatives:
  - no copied artifact pattern
  - no mirror metal outline
  - no dense wallpaper repeat
  - no wet shine
  - no random pseudo-calligraphy
  anti_taste_patterns:
  - medallion becomes museum reproduction
  - motif becomes dense wallpaper ornament
  - goldline turns mirror-like
  - flat color fields gain gradients
  is_vs_is_not:
    is: matte goldline and flat celadon gouache on xuan paper
    is_not: artifact copy, lacquer seal, ink wash, pixel grid, glass object
  default_gloss_guard: if mirror line, wet shine, or bright hotspot appears, repaint as matte flat gouache with dry goldline
    on paper
thumbnail_first_rules:
  min_size_px: 24
  grayscale_test: circular medallion and motif posture remain readable without hue
  silhouette_test: black silhouette keeps medallion, motif outline, Juju eye-nose triangle, and scarf field
  contact_sheet_64px_pass: true
  detail_survives_downscale_to: 24
batch_consistency_lock:
  camera: fixed front orthographic medallion view
  lighting: none-flat, no cast shadow or surface light
  material: same xuan paper, matte goldline, and flat gouache field behavior
  palette: reuse the exact same palette_engine 5-role result and seed across the batch
  safe_area: medallion within central 80%, at least 10% paper margin
  seed_policy: fixed medallion geometry and line thickness, vary only motif posture and color balance
human_review_rubric:
  silhouette_gate: pass if medallion and motif posture read at 64px
  material_exclusivity_gate: pass if it reads as matte gouache plus goldline on paper
  glass_budget_gate: must remain non-glass
  character_identity_gate: pass if Juju version keeps eye-nose triangle and orange/cinnabar scarf field
  contrast_gate_ratio: motif to paper at least 3:1
  drift_gate: fail copied artifact pattern, dense wallpaper repeat, mirror gold, wet shine, or random pseudo-writing
  pass_fail_scoring: fail any hard gate before judging cultural elegance
  R1_palette_roles: subject shows at least 3 roles from the generated palette; area hierarchy keeps primary 55-70, secondary
    20-30, tertiary 5-15; no machine triad band
  R2_dark_anchor: Detail is the unique dark anchor; every bright role clears tone delta 40 and Primary clears tone delta 50;
    never pure black or gray
  R3_silhouette_weight: black-silhouette test passes; minimum stroke is at least tile/32; app_icon subject scale targets 82-88%
    optical live area
  R4_quiet_ground: generation ground is pure white with no shadow; app_icon has no alpha; tile chroma stays below half of
    subject chroma
  R5_first_glance_read: one focal subject, readable at 48px, high-key without muddy dark regions
reference_policy:
  clean_room_boundary: learn public principles of baimiao linework, matte goldline outlining, circular medallion composition,
    and traditional motif abstraction only; do not copy any artifact, wenyang asset, dataset text, prompt, image, or composition
  no_third_party_names: true
  no_copied_prompts_or_images: true
  original_naming_lock: celadon-goldline is an original Signet style id
  notes:
  - wenyang.net may be consulted only as an external optional resource; do not bundle or paraphrase its CC BY-NC 4.0 images
    or descriptions
regeneration_strategy:
  if_too_generic: strengthen circular medallion, celadon-indigo fields, and fine matte goldline contour
  if_too_busy: remove secondary ornament until one motif posture remains
  if_small_size_fails: thicken medallion contour, simplify motif to one pose, and drop paper fiber
  if_off_material: remove mirror metal, wet shine, gradients inside fields, and artifact-copy details
  if_character_drift: relock eye-nose triangle, drooping ears, circular medallion, and cinnabar scarf field
