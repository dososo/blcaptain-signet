schema_version: 3
id: satin-porcelain
english_name: Satin Porcelain
chinese_name: 柔瓷
summary: 'An opaque porcelain support style with calm ceramic volume, soft fully diffuse body light, and glaze-pool color
  breaks in recessed areas and thin rims.

  '
visual_dna:
- opaque porcelain body
- glaze-pool recesses
- thin color break on rims
prompt_fragment: 'an opaque satin porcelain Juju figurine with calm ceramic volume, soft fully diffuse body light, pooled
  glaze color in shallow recesses, thin color breaks along raised rims, centered front or slight three-quarter view.

  '
negative_fragment: 'text, letters, numbers, wordmarks, fake logos, brand lookalikes, watermarks, UI screenshots, busy backgrounds,
  mirror highlight, wet look, plastic toy surface, glass-like body, fuzzy edge, clay pressure dents.

  '
color_behavior:
  palette: Palette is generated per request by the 5-role engine; color lives on subject parts, Detail is the dark structural
    anchor, and the ground stays white or quiet tile tint. warm white porcelain body plus one muted glaze color and orange
    scarf accent, limited to four ceramic colors.
best_for:
- premium companion apps
- calm wellbeing
- education keepsakes
- collectible mascot sets
not_for:
- industrial hardware
- rough craft textures
- dense dashboard icons
brand_adaptation_rules:
- translate brand color into one pooled glaze zone
- keep orange scarf as a small ceramic accent band
- keep body color warm white and opaque across the set
example_subjects:
- Juju porcelain figurine
- porcelain cloud
- ceramic star charm
material_exclusivity:
  exclusive_material: opaque satin porcelain with controlled glaze pooling
  material_family: satin-porcelain
  allows_glass: false
  light_model_enum: fully-diffuse
  forbidden_finish:
  - mirror highlight
  - glossy wet look
  - gel body
  - translucent shell
  - specular hotspot
  - plastic sheen
  imperfection_injection: tiny ceramic rim break, glaze pool in recess, soft kiln speckle under control
character_dna:
  ref: juju
  species: white Bichon Frise curly-coat small dog
  role: complex-problem organizer rendered as a calm porcelain figurine
  silhouette_invariants:
  - drooping-ear Bichon blob head and body mass
  - short-leg small-dog proportion
  - rounded curly-coat outer contour
  face_geometry:
    eye_nose_triangle: two dark ceramic eye dots plus one nose dot in fixed triangle
    eye_spacing: one implied eye-width gap between eyes
    catchlight: none
    expression_set:
    - focused
    - curious
    - reassuring
    - thinking
    - pointing-out
  proportion:
    head_to_body: large head, compact body, short legs
    canonical_angle: front or slight 3/4 ceramic figurine
  identity_marks:
  - orange scarf as a raised ceramic band with glaze break
  identity_color:
    coat: warm white porcelain
    accent: orange ceramic scarf
    theme_color: muted glaze pool color
    annotation: none
  free_variables:
  - pose
  - glaze pool placement
  - small ceramic prop
  - expression
  action_vocabulary:
  - pointing
  - sorting-cards
  - holding-note
  - untangling-lines
  articulation_joints:
    deformable:
    - neck-tilt
    - front-paw-point
    - tail
    rigid:
    - eye-nose triangle
    - ear droop
    - short-leg proportion
    - scarf band
  forbidden_drift:
  - glass-like-body
  - clay-pressure-dents
  - felt-fiber-edge
  - missing-eye-nose-triangle
  - missing-orange-scarf
  - rubber-toy-shine
  character_fit: capable
  reference_artifacts:
  - turnaround_front_34_side
  - expression_sheet
  - do_dont_sheet
style_recipe:
  material_stack:
    base: opaque warm white porcelain body
    edge: smooth ceramic rim with thin color break
    inner_detail: glaze-pool recesses and tiny kiln speckles
    finish: satin matte ceramic surface with controlled glaze pooling
  lighting_rig:
    model_enum: fully-diffuse
    key: broad soft diffuse light over ceramic volume
    rim: none
    shadow: small soft contact shadow under the figurine
    forbidden_lighting:
    - mirror highlight
    - wet surface shine
    - hard rim
    - bloom
    - reflective hotspot
  camera:
    angle: front or slight 3/4 figurine view
    projection: orthographic or very light perspective
    crop: full ceramic figure with breathing margin
    safe_area_pct: 80
  color_system:
    max_colors: 4
    primary_role: warm white porcelain body
    accent_role: orange scarf and one muted glaze pool
    contrast_rule_ratio: '3:1'
    palette_engine: per-request 5-role subject-carried palette; no fixed style-owned hex
    subject_carried_roles: primary/secondary/tertiary/accent/detail are assigned to subject parts; ground remains white or
      quiet tile tint
  detail_budget:
    macro: calm rounded porcelain silhouette
    mid: glaze pools in two or three recesses
    micro: tiny kiln speckles and rim breaks
    legibility_floor_px: 32
  edge_quality:
    outline: smooth ceramic rim
    interior_corner: soft recessed ceramic curve
    terminal: thin glaze break at raised edge
    bevel: low ceramic roundover
    anti_aliasing: clean soft ceramic edge
  keyline_block:
    canvas_px: 1024
    live_area_px: 820
    padding_px: 102
    stroke_px: 18
    corner_radius_px: 44
    min_gap_px: 28
    pixel_snap: true
style_separation_lock:
  orthogonality_axis: light_model
  namable_archetype: opaque satin porcelain figurine
  silhouette_rule: calm ceramic volume plus glaze-pool recesses read at 64px
  separation_matrix_neighbors:
  - felt-field
  - matte-clay
  must_differ_from:
  - id: felt-field
    differ_on:
    - edge
    - grain
    claim: smooth ceramic rim and glaze-pool recesses, not fuzzy wool fiber halo and poke texture
  - id: matte-clay
    differ_on:
    - edge
    - grain
    claim: porcelain rim breaks and glaze pools, not inflated clay pressure dents and tinted outer shadow
anti_style_drift:
  banned_tokens: shared
  per_style_negatives:
  - no mirror highlight
  - no wet look
  - no clay dents
  - no felt fuzz
  - no glass-like shell
  anti_taste_patterns:
  - ceramic becomes shiny toy plastic
  - glaze pool turns into transparent glass
  - edge gets fuzzy like felt
  - body inflates into claymorphism
  is_vs_is_not:
    is: opaque satin porcelain with pooled glaze and rim break
    is_not: felt, matte clay, glass, rubber toy
  default_gloss_guard: if mirror highlight or wet surface appears, regenerate as opaque satin porcelain with soft diffuse
    body
thumbnail_first_rules:
  min_size_px: 24
  grayscale_test: ceramic body, eye-nose triangle, and scarf band survive without color
  silhouette_test: black silhouette preserves Juju ears, short legs, and rounded ceramic body
  contact_sheet_64px_pass: true
  detail_survives_downscale_to: 24
batch_consistency_lock:
  camera: same front or slight 3/4 ceramic figurine view
  lighting: fully diffuse with no hard rim
  material: same opaque porcelain body, glaze pool scale, and rim break
  palette: reuse the exact same palette_engine 5-role result and seed across the batch
  safe_area: subject within central 80%, at least 10% margin
  seed_policy: fixed glaze pool density and rim break thickness
human_review_rubric:
  silhouette_gate: pass if porcelain Juju reads at 64px
  material_exclusivity_gate: pass if surface is opaque satin porcelain with glaze pools
  glass_budget_gate: must remain non-glass
  character_identity_gate: pass if Juju keeps eye-nose triangle, ears, short legs, and orange scarf
  contrast_gate_ratio: glaze pool and body at least 3:1 apart
  drift_gate: fail wet look, glass-like shell, felt fuzz, clay dents, or toy reflection
  pass_fail_scoring: fail any hard gate before judging ceramic calm
  R1_palette_roles: subject shows at least 3 roles from the generated palette; area hierarchy keeps primary 55-70, secondary
    20-30, tertiary 5-15; no machine triad band
  R2_dark_anchor: Detail is the unique dark anchor; every bright role clears tone delta 40 and Primary clears tone delta 50;
    never pure black or gray
  R3_silhouette_weight: black-silhouette test passes; minimum stroke is at least tile/32; app_icon subject scale targets 82-88%
    optical live area
  R4_quiet_ground: generation ground is pure white with no shadow; app_icon has no alpha; tile chroma stays below half of
    subject chroma
  R5_first_glance_read: one focal subject, readable at 48px, high-key without muddy dark regions
reference_policy:
  clean_room_boundary: learn public ceramic figurine and porcelain glaze principles only; do not copy any third-party ceramic
    object, prompt, image, or composition
  no_third_party_names: true
  no_copied_prompts_or_images: true
  original_naming_lock: satin-porcelain is an original Signet style id
regeneration_strategy:
  if_too_generic: strengthen glaze-pool recesses and thin rim breaks
  if_too_busy: reduce glaze pools and remove tiny speckles first
  if_small_size_fails: enlarge eye-nose triangle and scarf band, simplify glaze areas
  if_off_material: remove wet surface, toy shine, clay dents, felt fuzz, and clear shell
  if_character_drift: lock drooping ears, short legs, eye-nose triangle, and orange scarf ceramic band
