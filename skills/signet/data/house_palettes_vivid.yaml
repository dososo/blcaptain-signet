role_chroma_bands:
  primary:
    area_pct: [55, 70]
    oklch_l: [0.62, 0.82]
    chroma_ratio_min: 0.60
    chroma_floor: 0.14
  secondary:
    area_pct: [20, 30]
    oklch_l: [0.60, 0.80]
    chroma_ratio_min: 0.55
    chroma_floor: 0.11
  tertiary:
    area_pct: [5, 15]
    oklch_l: [0.55, 0.78]
    chroma_ratio_min: 0.75
    chroma_floor: 0.13
    note: the single vivid spike
  accent:
    area_pct: [3, 8]
    oklch_l: [0.90, 0.97]
    chroma_range: [0.03, 0.10]
  detail:
    area_pct: [2, 8]
    oklch_l: [0.30, 0.45]
    chroma_range: [0.05, 0.11]
hue_rotation:
  min_span_deg:
    n_3_to_5: 120
    n_6_plus: 210
    absolute_floor: 90
  per_set_step: 360_div_n
  seeded_jitter_deg: 8
  warm_cool_ratio: [60, 40, 80, 20]
  invariant_roles:
    - material tell
    - detail dark-anchor family
    - house accent when explicitly locked
colored_ground_modes:
  cream-tint:
    oklch_l: [0.94, 0.97]
    oklch_c_max: 0.045
    use: Tier E and quiet editorial surfaces
  saturated-sibling:
    oklch_l: [0.70, 0.86]
    oklch_c: [0.10, 0.16]
    hue_shift_from_primary_deg: [20, 40]
    use: Tier D front-door icon tile
  dark-anchor:
    oklch_l: [0.20, 0.32]
    oklch_c: [0.05, 0.10]
    use: dramatic Tier D tile and dark-mode presentation
